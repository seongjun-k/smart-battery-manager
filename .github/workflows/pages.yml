# 웹 대시보드 + 브라우저 안 시뮬레이터(Pyodide)를 GitHub Pages로 배포한다
name: pages
on:
  push:
    branches: [master]
    paths: [web/**, sim/sim.py, demo/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site
          cp web/* sim/sim.py demo/pysim.js _site/
          sed -i 's|<script src="chart.umd.min.js"></script>|<script src="pysim.js"></script>\n&|' _site/index.html
          grep -q pysim.js _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
