<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트 배터리 관리 디바이스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='6' width='18' height='12' rx='3' fill='%2334d399'/%3E%3Crect x='20.5' y='10' width='2' height='4' rx='1' fill='%2334d399'/%3E%3C/svg%3E">
<script src="chart.umd.min.js"></script>
<script src="oledfont.js"></script>
<style>
  /* 장치 AP 모드에서도 열리도록 외부 글꼴·CDN 없이 시스템 글꼴만 쓴다 */
  :root {
    --bg: #0b0b0d; --card: #151518; --card2: #1d1d21; --line: #26262c;
    --text: #f4f4f5; --sub: #a1a1aa; --dim: #6b6b74;
    --accent: #34d399; --accent-ink: #052e22;
    --warn: #fbbf24; --bad: #f87171; --hi: #c4b5fd; --lo: #7dd3fc;
    --r: 18px;
    --font: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* 위쪽 */
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(11, 11, 13, .85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .top { display: flex; align-items: center; gap: 12px; max-width: 980px; margin: 0 auto; padding: 12px 20px; }
  .title { font-weight: 650; font-size: 16px; letter-spacing: -.2px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--card2); color: var(--sub); font-size: 12.5px; }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .badge.on i { background: var(--accent); }
  .grow { flex: 1; }
  .stop {
    padding: 8px 20px; border: 0; border-radius: 999px; background: var(--bad); color: #fff; font-weight: 700;
    cursor: pointer; transition: transform .08s, filter .15s;
  }
  .stop:hover { filter: brightness(1.08); }
  .stop:active { transform: scale(.97); }
  nav { display: flex; gap: 4px; max-width: 980px; margin: 0 auto; padding: 0 20px 10px; overflow-x: auto; scrollbar-width: none; }
  nav button {
    padding: 7px 16px; border: 0; border-radius: 999px; background: none; color: var(--sub); cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { background: var(--card2); color: var(--text); font-weight: 600; }

  main { max-width: 980px; margin: 0 auto; padding: 20px 20px 48px; display: grid; gap: 16px; }
  body.offline main { opacity: .5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
  .card h2 { margin: 0 0 16px; font-size: 15px; font-weight: 600; color: var(--sub); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) {
    .top { padding: 10px 16px; } nav { padding: 0 16px 10px; } main { padding: 16px 16px 40px; gap: 12px; }
    .card { padding: 18px; } .row { grid-template-columns: 1fr; gap: 12px; }
    .badge.sim { display: none; }
  }

  /* 경고 */
  .alarm { display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: var(--r); background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .35); color: #fecaca; }
  .alarm b { font-weight: 650; }
  .alarm span { color: #fca5a5; font-size: 13px; }

  /* 지금 상태 */
  .hero { display: flex; gap: 24px; align-items: center; }
  .hero .what { flex: 1; min-width: 0; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--card2); color: var(--sub); font-size: 12.5px; }
  .chip.run { background: rgba(52, 211, 153, .14); color: var(--accent); }
  .hero h1 { margin: 10px 0 4px; font-size: 30px; font-weight: 700; letter-spacing: -.6px; line-height: 1.2; }
  .hero p { margin: 0; color: var(--sub); }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bg { stroke: var(--card2); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s; }
  .ring div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring b { font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  .ring b small { font-size: 15px; color: var(--sub); font-weight: 500; }
  .ring span { font-size: 12px; color: var(--sub); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
  .stat { padding: 14px 16px; border-radius: 14px; background: var(--card2); }
  .stat small { display: block; color: var(--sub); font-size: 13px; }
  .stat b { font-size: 26px; font-weight: 650; letter-spacing: -.4px; }
  .stat em { font-style: normal; color: var(--sub); margin-left: 3px; }
  @media (max-width: 720px) {
    .hero { flex-direction: column-reverse; align-items: flex-start; gap: 16px; }
    .hero h1 { font-size: 25px; } .ring { width: 112px; height: 112px; }
    .stats { gap: 8px; } .stat { padding: 12px; } .stat b { font-size: 21px; }
  }

  /* 모드 시작 */
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    padding: 9px 16px; border-radius: 999px; background: var(--card2); color: var(--sub); cursor: pointer;
    border: 1px solid transparent; transition: background .15s, color .15s;
  }
  .seg input:checked + label { background: var(--text); color: var(--bg); font-weight: 600; }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg.off { opacity: .35; pointer-events: none; }
  .desc { margin: 10px 0 0; color: var(--sub); font-size: 14px; }
  .fields { display: flex; flex-wrap: wrap; gap: 20px 32px; margin-top: 20px; align-items: flex-end; }
  .fields > div > small { display: block; margin-bottom: 8px; color: var(--sub); font-size: 13px; }
  .cap { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--card2); }
  .cap input { width: 72px; border: 0; background: none; outline: none; font-weight: 600; }
  .cap span { color: var(--sub); }
  .go {
    margin-left: auto; padding: 12px 30px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; cursor: pointer; transition: filter .15s, transform .08s;
  }
  .go:hover { filter: brightness(1.06); }
  .go:active { transform: scale(.97); }
  .go:disabled { background: var(--card2); color: var(--dim); cursor: not-allowed; }
  .why { margin: 12px 0 0; color: var(--dim); font-size: 13px; }

  /* 셀 */
  .cells-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .cells-h h2 { margin: 0; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--card2); }
  .pill.ok { color: var(--accent); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
  .cell { display: grid; grid-template-columns: 34px 1fr 64px 62px; gap: 12px; align-items: center; padding: 7px 0; }
  .cell .n { color: var(--sub); font-size: 13px; }
  .cell .bar { position: relative; height: 8px; border-radius: 999px; background: var(--card2); overflow: hidden; }
  .cell .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--sub); transition: width .4s; }
  .cell.hi .bar i { background: var(--hi); } .cell.lo .bar i { background: var(--lo); }
  .cell.bal .bar i { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .cell .v { text-align: right; font-weight: 600; }
  .cell .d { text-align: right; color: var(--dim); font-size: 13px; }
  .cell .d.warn { color: var(--warn); } .cell .d.bad { color: var(--bad); }
  .note { margin: 12px 0 0; color: var(--dim); font-size: 13px; }
  .empty { padding: 28px 0; text-align: center; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { .cell.bal .bar i { animation: none; } }

  /* 요약 두 칸 */
  .big { font-size: 34px; font-weight: 700; letter-spacing: -.6px; }
  .big small { font-size: 16px; font-weight: 500; color: var(--sub); margin-left: 4px; }
  .kv { margin: 14px 0 0; padding: 0; list-style: none; }
  .kv li { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); color: var(--sub); }
  .kv b { color: var(--text); font-weight: 600; }
  .meter { height: 6px; margin-top: 12px; border-radius: 999px; background: var(--card2); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width .5s, background .3s; }

  /* 그래프 */
  .chart { position: relative; height: 260px; }
  .chart .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0; }

  /* 장치 */
  .oled-card { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .screen { width: 100%; max-width: 520px; padding: 10px; border-radius: 14px; background: #000; }
  #oled { display: block; width: 100%; aspect-ratio: 2 / 1; }
  .keys { display: flex; gap: 10px; }
  .keys button {
    padding: 9px 20px; border: 1px solid var(--line); border-radius: 999px; background: var(--card2); cursor: pointer; font-weight: 600;
  }
  .keys button.red { color: var(--bad); }
  .keys button:disabled { opacity: .4; cursor: not-allowed; }
  .view { color: var(--sub); font-size: 13px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
  .switch small { display: block; color: var(--dim); font-size: 13px; }
  .switch input { position: absolute; opacity: 0; }
  .switch i { position: relative; width: 44px; height: 26px; flex: none; border-radius: 999px; background: var(--card2); transition: background .2s; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--sub); transition: transform .2s, background .2s; }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(18px); background: #fff; }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .faults { display: flex; flex-wrap: wrap; gap: 8px; }
  .faults button { padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card2); cursor: pointer; }
  .faults button:hover { border-color: var(--warn); }

  /* 기록 */
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
  .log li:first-child { border-top: 0; }
  .log time { color: var(--dim); font-size: 13px; min-width: 58px; }
  .log li.err span { color: #fca5a5; }
</style>
</head>
<body class="offline">
<header>
  <div class="top">
    <span class="title">스마트 배터리 관리</span>
    <span class="badge" id="conn"><i></i><span>연결 끊김</span></span>
    <span class="badge sim" id="simTag" hidden>시뮬레이터</span>
    <span class="grow"></span>
    <button class="stop" id="stop" type="button">정지</button>
  </div>
  <nav role="tablist" aria-label="화면">
    <button role="tab" data-tab="home" aria-selected="true">개요</button>
    <button role="tab" data-tab="chart" aria-selected="false">그래프</button>
    <button role="tab" data-tab="device" aria-selected="false">장치</button>
    <button role="tab" data-tab="log" aria-selected="false">기록</button>
  </nav>
</header>

<main>
  <!-- 개요 -->
  <div class="alarm" id="alarm" role="alert" data-pane="home" hidden></div>

  <section class="card" data-pane="home" aria-label="지금 상태">
    <div class="hero">
      <div class="what">
        <span class="chip" id="chip">-</span>
        <h1 id="heroTitle">연결 대기</h1>
        <p id="heroNote">장치에 연결하는 중입니다.</p>
      </div>
      <div class="ring">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="ringFg" cx="50" cy="50" r="44"/></svg>
        <div><b class="num" id="pct">-</b><span id="eta"></span></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><small>전력</small><b class="num" id="mP">-</b><em>W</em></div>
      <div class="stat"><small>전류</small><b class="num" id="mI">-</b><em>A</em></div>
      <div class="stat"><small id="mVlab">팩 전압</small><b class="num" id="mV">-</b><em>V</em></div>
    </div>
  </section>

  <section class="card" id="startCard" data-pane="home" aria-label="모드 시작">
    <h2>모드 시작</h2>
    <form id="startForm">
      <div class="seg" id="modes"></div>
      <p class="desc" id="modeDesc"></p>
      <div class="fields">
        <div id="tgtBox"><small>목표 셀 전압</small>
          <div class="seg">
            <input type="radio" name="tgt" id="t380" value="3.80" checked><label for="t380">3.80 V</label>
            <input type="radio" name="tgt" id="t385" value="3.85"><label for="t385">3.85 V</label>
            <input type="radio" name="tgt" id="t390" value="3.90"><label for="t390">3.90 V</label>
          </div>
        </div>
        <div><small>배터리 용량</small>
          <label class="cap"><input type="number" id="capIn" value="2200" min="100" max="20000" step="100" inputmode="numeric" aria-label="배터리 용량"><span>mAh</span></label>
        </div>
        <button class="go" type="submit" id="go">시작</button>
      </div>
      <p class="why" id="why"></p>
    </form>
  </section>

  <section class="card" data-pane="home" aria-label="셀 전압">
    <div class="cells-h"><h2>셀 전압</h2><span class="pill num" id="delta" hidden></span></div>
    <div id="cells"></div>
    <p class="note" id="cellNote"></p>
  </section>

  <div class="row" data-pane="home">
    <section class="card" aria-label="건강도">
      <h2>건강도</h2>
      <div class="big num" id="soh">-</div>
      <div class="meter"><i id="sohBar"></i></div>
      <ul class="kv">
        <li>셀 내부저항 <b class="num" id="irRange">-</b></li>
        <li>측정 용량 <b class="num" id="cap">-</b></li>
      </ul>
    </section>
    <section class="card" aria-label="냉각">
      <h2>방열판</h2>
      <div class="big num" id="tSink">-</div>
      <div class="meter"><i id="tBar"></i></div>
      <ul class="kv">
        <li>팬 <b class="num" id="fan">-</b></li>
        <li>부하 듀티 <b class="num" id="duty">-</b></li>
      </ul>
    </section>
  </div>

  <!-- 그래프 -->
  <section class="card" data-pane="chart" hidden aria-label="팩 전압과 전류">
    <h2>팩 전압과 전류</h2>
    <div class="chart"><canvas id="chartVI"></canvas><div class="empty" id="emptyVI">작업을 시작하면 기록합니다</div></div>
  </section>
  <section class="card" data-pane="chart" hidden aria-label="방열판 온도">
    <h2>방열판 온도</h2>
    <div class="chart"><canvas id="chartT"></canvas><div class="empty" id="emptyT">작업을 시작하면 기록합니다</div></div>
  </section>

  <!-- 장치 -->
  <section class="card oled-card" data-pane="device" hidden aria-label="장치 화면">
    <div class="screen"><canvas id="oled" width="512" height="256" aria-label="장치 OLED 화면"></canvas></div>
    <div class="keys">
      <button type="button" id="kNext">NEXT</button>
      <button type="button" id="kOk">OK</button>
      <button type="button" id="kStop" class="red">STOP</button>
    </div>
    <span class="view" id="view"></span>
  </section>
  <section class="card" data-pane="device" hidden aria-label="설정">
    <label class="switch"><span>부저 버튼음<small>정지음과 경고음은 끌 수 없습니다</small></span><input type="checkbox" id="keyTone" checked><i></i></label>
  </section>
  <section class="card" id="faultCard" data-pane="device" hidden aria-label="결함 주입">
    <h2>결함 주입 (시뮬레이터 전용)</h2>
    <div class="faults">
      <button type="button" data-fault="imbalance">셀 불균형</button>
      <button type="button" data-fault="fan_stop">팬 정지</button>
      <button type="button" data-fault="overheat">과열</button>
      <button type="button" data-fault="disconnect">연결 불량</button>
      <button type="button" data-fault="high_ir">내부저항 증가</button>
      <button type="button" data-fault="clear">모두 해제</button>
    </div>
  </section>

  <!-- 기록 -->
  <section class="card" data-pane="log" hidden aria-label="기록">
    <ol class="log" id="log"></ol>
    <div class="empty" id="logEmpty">아직 기록이 없습니다</div>
  </section>
</main>

<script>
// 영문 코드는 장비 OLED와 같은 글자. 펌웨어·시뮬레이터의 키와 짝을 맞출 것
const KO = {
  state: { IDLE: '대기', DIAG: '진단', SELECT: '모드 선택', RUN: '실행', DONE: '완료', HOLD: '유지', STOP: '정지' },
  mode: { STORAGE: '보관', BALANCE: '밸런싱', CAPACITY: '용량 테스트', DIAG: '진단' },
  alarm: {
    CONN: '연결 불량', IMBALANCE: '셀 불균형', UNDERVOLT: '셀 저전압',
    OVERTEMP_SINK: '방열판 과열', FAN_STOP: '팬 정지', CHARGE_NEEDED: '충전 필요', HIGH_IR: '내부저항 높음',
  },
  limit: { I_P: '전력 한도', I_C: 'C-rate 한도', I_T: '온도 한도', I_V: '전압 한도', I_HW: '하드웨어 한도', REST: '휴지 중' },
  event: { START: '모드 시작', DONE: '완료', STOP: '정지' },
};
const MODE_DESC = {
  STORAGE: '셀당 목표 전압까지 방전해 보관 상태로 맞춥니다.',
  BALANCE: '전압이 높은 셀만 조금씩 방전해 셀 간 차이를 줄입니다.',
  CAPACITY: '3.60 V까지 방전하면서 실제 용량을 잽니다.',
  DIAG: '짧은 펄스 부하로 셀별 내부저항을 다시 잽니다.',
};
const BAL_DONE_MV = 10;   // sim.py BAL_DONE_V와 같게
const MAX_POINTS = 900;
const STARTABLE = ['SELECT', 'DONE', 'HOLD', 'STOP'];   // sim.py command()의 시작 가능 상태
const V_LO = 3.3, V_HI = 4.2;   // 셀 막대 범위
const $ = id => document.getElementById(id);
const ko = (g, k) => (k && KO[g][k]) || '';
const f = (x, d) => (x == null || Number.isNaN(x) ? '-' : x.toFixed(d));
const clamp = (x, lo, hi) => Math.min(Math.max(x, lo), hi);

let ws, last = null, hist = [], oledView = 0;

function clock(t) {
  const s = Math.max(0, Math.floor(t)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

/* ---------- 탭 ---------- */
const tabs = [...document.querySelectorAll('nav button')];
function showTab(name) {
  tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  document.querySelectorAll('[data-pane]').forEach(el => { el.hidden = el.dataset.pane !== name; });
  if (last) render(last, true);   // 숨어 있던 칸(경고, 시작, 결함 주입)을 지금 상태로 다시 맞춘다
  try { localStorage.setItem('tab', name); } catch (e) { /* 저장소가 막혀도 동작 */ }
}
tabs.forEach(b => { b.onclick = () => showTab(b.dataset.tab); });
const curTab = () => tabs.find(b => b.getAttribute('aria-selected') === 'true').dataset.tab;

/* ---------- 모드 버튼 ---------- */
$('modes').innerHTML = Object.keys(MODE_DESC).map((k, i) =>
  `<input type="radio" name="mode" id="m${k}" value="${k}"${i ? '' : ' checked'}><label for="m${k}">${KO.mode[k]}</label>`).join('');

/* ---------- 기록 ---------- */
function log(text, err) {
  const li = document.createElement('li');
  const t = document.createElement('time');
  t.textContent = clock(last ? last.t : 0);
  const sp = document.createElement('span');
  sp.textContent = text;
  li.append(t, sp);
  if (err) li.className = 'err';
  $('log').prepend(li);
  $('logEmpty').hidden = true;
  while ($('log').children.length > 50) $('log').lastChild.remove();
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $('conn').className = 'badge on'; $('conn').lastChild.textContent = '연결됨'; document.body.classList.remove('offline'); };
  ws.onclose = () => {
    $('conn').className = 'badge'; $('conn').lastChild.textContent = '연결 끊김'; document.body.classList.add('offline');
    syncStart();
    setTimeout(connect, 1000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'status') render(m);
    else if (m.type === 'error') log(`명령 거부: ${m.msg}`, true);
  };
}
const online = () => ws && ws.readyState === WebSocket.OPEN;
function send(cmd) {
  if (online()) ws.send(JSON.stringify({ type: 'cmd', ...cmd }));
  else log('장치와 연결되지 않아 명령을 보내지 못했습니다', true);
}

/* ---------- 그래프 ---------- */
Chart.defaults.color = '#a1a1aa';
Chart.defaults.borderColor = '#26262c';
Chart.defaults.font.family = '"Segoe UI", "Malgun Gothic", system-ui, sans-serif';
// 기준선 (가로 점선 + 이름표)
const guides = {
  id: 'guides',
  afterDatasetsDraw(c, _, opts) {
    const { ctx, chartArea: a, scales: { y } } = c;
    (opts.lines || []).forEach(([v, color, label]) => {
      const py = y.getPixelForValue(v);
      if (py < a.top || py > a.bottom) return;
      ctx.save();
      ctx.strokeStyle = color; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
      ctx.fillStyle = color; ctx.font = '11px "Segoe UI", "Malgun Gothic", sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(label, a.right - 4, py - 5);
      ctx.restore();
    });
  },
};
function chart(canvas, sets, axes, lines) {
  return new Chart(canvas, {
    type: 'line',
    plugins: [guides],
    data: { datasets: sets.map(([label, color, yAxisID]) => ({
      label, borderColor: color, backgroundColor: color, yAxisID, data: [], borderWidth: 2, pointRadius: 0, tension: 0.3,
    })) },
    options: {
      animation: false, maintainAspectRatio: false, parsing: false, normalized: true,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: { legend: { align: 'end', labels: { boxWidth: 8, boxHeight: 8, usePointStyle: true, pointStyle: 'circle' } }, guides: { lines } },
      scales: {
        x: { type: 'linear', min: 0, grid: { display: false }, title: { display: true, text: '경과 시간 (분)' } },
        ...axes,
      },
    },
  });
}
const chartVI = chart($('chartVI'), [['팩 전압 (V)', '#7dd3fc', 'y'], ['전류 (A)', '#34d399', 'y1']], {
  y: { position: 'left', grid: { color: '#1d1d21' } },
  y1: { position: 'right', grid: { drawOnChartArea: false }, min: 0, suggestedMax: 2 },
}, []);
const chartT = chart($('chartT'), [['방열판 (°C)', '#fb923c', 'y']], {
  y: { suggestedMin: 20, suggestedMax: 100, grid: { color: '#1d1d21' } },
}, [[80, 'rgba(251,191,36,.9)', '80 °C 감속'], [95, 'rgba(248,113,113,.9)', '95 °C 정지']]);
function clearCharts() {
  [chartVI, chartT].forEach(c => { c.data.datasets.forEach(d => { d.data = []; }); c.update('none'); });
  $('emptyVI').hidden = $('emptyT').hidden = false;
}
function push(c, x, ys) {
  c.data.datasets.forEach((d, i) => { d.data.push({ x, y: ys[i] }); if (d.data.length > MAX_POINTS) d.data.shift(); });
  if (c === chartVI) {   // 팩 전압 축은 0.4 V 폭 이상. 밸런싱처럼 거의 안 변할 때 0.01 V 반올림 계단이 파형처럼 보이지 않게
    const v = c.data.datasets[0].data.map(p => p.y), y = c.options.scales.y;
    y.suggestedMin = Math.min(...v) - 0.2; y.suggestedMax = Math.max(...v) + 0.2;
  }
  if (curTab() === 'chart') c.update('none');
}

/* ---------- 남은 시간 ---------- */
// 진행률은 장치가 보낸다. 최근 1~2분 진행 속도로 남은 시간만 추정
function eta(p, t) {
  hist.push([t, p]);
  while (hist.length > 2 && t - hist[1][0] > 120) hist.shift();
  const [t0, p0] = hist[0];
  if (t - t0 < 60 || p <= p0) return null;
  return (1 - p) * (t - t0) / (p - p0);
}

/* ---------- OLED 미러 (128x64, 1비트) ---------- */
// 펌웨어 OLED 화면과 같은 배치. 한쪽을 바꾸면 다른 쪽도 고친다
const oled = $('oled'), og = oled.getContext('2d');
function oledFrame(s) {
  const lines = [], title = t => lines.push({ t, title: true });
  const prog = p => lines.push({ bar: p });
  const lo = s.cells.length ? Math.min(...s.cells) : 0, hi = s.cells.length ? Math.max(...s.cells) : 0;
  const views = s.state === 'RUN' ? 3 : 2;
  const v = oledView % views;
  if (v === 1 && s.cellCount) {
    lines.push({ t: `CELLS   d=${Math.round((hi - lo) * 1000)}mV`, cells: true });
    return lines;
  }
  if (s.state === 'RUN' && v === 0) {
    title({ STORAGE: 'DISCHARGING', BALANCE: 'BALANCING', CAPACITY: 'CAP TEST' }[s.mode] || s.mode);
    lines.push({ t: `I ${f(s.current, 2)}A P ${f(s.packV * s.current, 1)}W` });
    lines.push({ t: s.mode === 'BALANCE' ? `d ${Math.round((hi - lo) * 1000)}mV  to 10mV` : `Vmin ${f(lo, 2)} tgt ${f(s.targetV, 2)}` });
    lines.push({ t: `Time ${clock(s.elapsed || 0)}` });
    prog(s.progress || 0);
    return lines;
  }
  if (s.state === 'RUN') {   // v === 2
    title(`${s.mode} MODE`);
    lines.push({ t: `${s.cellCount}S  ${f(s.packV, 2)}V` });
    lines.push({ t: `RUN ${Math.round(s.packV * s.current)}W ${f(s.current, 2)}A` });
    lines.push({ t: `Load ${Math.round(s.tempSink)}C Fan ${s.fanRpm}` });
    lines.push({ t: 'NEXT:view STOP:end' });
    return lines;
  }
  if (s.state === 'SELECT') {   // NEXT로 고른 모드를 OK로 시작
    title('SELECT MODE');
    lines.push({ t: `> ${s.selMode}` });
    lines.push({ t: `${s.cellCount}S  ${f(s.packV, 2)}V` });
    lines.push({ t: s.alarms.length ? s.alarms[0] : `SOH ${s.soh ?? '-'}` });
    lines.push({ t: 'NEXT:mode OK:start' });
    return lines;
  }
  const head = { IDLE: 'CONNECT BATT', DIAG: 'DIAGNOSING', SELECT: 'SELECT MODE', DONE: 'DONE', HOLD: 'HOLD', STOP: 'STOPPED' }[s.state] || s.state;
  title(head);
  if (s.alarms.length) lines.push({ t: s.alarms[0] });
  if (s.cellCount) lines.push({ t: `${s.cellCount}S  ${f(s.packV, 2)}V` });
  if (s.soh != null) lines.push({ t: `SOH ${s.soh}  IR ${f(Math.max(...(s.ir || [0])), 1)}m` });
  if (s.capMeasuredAh != null) lines.push({ t: `CAP ${Math.round(s.capMeasuredAh * 1000)}mAh` });
  lines.push({ t: s.state === 'SELECT' ? 'NEXT:mode OK:start' : 'NEXT:view' });
  return lines;
}

// u8g2 그리기 함수를 그대로 옮긴 1비트 프레임 버퍼. 글꼴은 oledfont.js (펌웨어와 같은 u8g2 글꼴)
const FB = new Uint8Array(128 * 64);
const px = (x, y) => { if (x >= 0 && x < 128 && y >= 0 && y < 64) FB[y * 128 + x] = 1; };
const drawBox = (x, y, w, h) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j); };
const drawHLine = (x, y, w) => drawBox(x, y, w, 1);
const drawFrame = (x, y, w, h) => { drawHLine(x, y, w); drawHLine(x, y + h - 1, w); drawBox(x, y, 1, h); drawBox(x + w - 1, y, 1, h); };
function drawStr(font, x, y, s) {
  const F = OLED_FONTS[font], base = y + F.asc + 1;   // setFontPosTop
  for (const ch of s) {
    const [w, h, gx, gy, dx, ...rows] = F.g[ch.charCodeAt(0) - 32] || F.g[0];
    const top = base - h - gy;
    rows.forEach((r, j) => { for (let i = 0; i < w; i++) if ((r >> (w - 1 - i)) & 1) px(x + gx + i, top + j); });
    x += dx;
  }
}

// 펌웨어 oledUpdate()와 같은 좌표
function drawOled(s) {
  FB.fill(0);
  const cells = s.cells.map(c => +c.toFixed(3));
  let y = 0;
  for (const L of oledFrame(s)) {
    if (L.cells) {
      drawStr('f5x8', 1, 0, L.t);
      const lo = Math.min(...cells), hi = Math.max(...cells), rows = cells.length, h = Math.floor(52 / rows);
      cells.forEach((c, k) => {
        const yy = 11 + k * h;
        drawStr('f5x8', 1, yy, `C${k + 1}`);
        drawBox(16, yy + 1, 14 + Math.round(50 * (hi > lo ? (c - lo) / (hi - lo) : 1)), h - 3);
        drawStr('f5x8', 96, yy, c.toFixed(2));
      });
      break;
    }
    if (L.bar != null) {
      drawFrame(1, y + 1, 126, 9); drawBox(3, y + 3, Math.round(122 * L.bar), 5);
      y += 11; continue;
    }
    drawStr(L.title ? 'f6x12' : 'f5x8', 1, y, L.t);
    y += L.title ? 13 : 10;
    if (L.title) { drawHLine(0, y - 1, 128); y += 2; }
  }
  paintOled();
  const n = s.state === 'RUN' ? 3 : 2;
  const names = s.state === 'RUN' ? ['진행', '셀 전압', '모드 요약'] : ['상태', '셀 전압'];
  $('view').textContent = `화면 ${oledView % n + 1}/${n} · ${names[oledView % n]}`;
}
// 화면에는 OLED 화소처럼 점으로 키워 그린다
function paintOled() {
  const S = oled.width / 128;
  og.fillStyle = '#000'; og.fillRect(0, 0, oled.width, oled.height);
  og.fillStyle = '#e0ecff';
  for (let y = 0; y < 64; y++) for (let x = 0; x < 128; x++) if (FB[y * 128 + x]) og.fillRect(x * S + .4, y * S + .4, S - .8, S - .8);
}
paintOled();

/* ---------- 셀 ---------- */
function renderCells(s) {
  const box = $('cells');
  $('delta').hidden = !s.cellCount;
  if (!s.cellCount) {
    box.innerHTML = '<div class="empty">셀 전압을 읽을 수 없습니다. 밸런스 잭 연결을 확인하세요.</div>';
    $('cellNote').textContent = '';
    return;
  }
  if (box.querySelectorAll('.cell').length !== s.cells.length) {
    box.innerHTML = s.cells.map((_, i) =>
      `<div class="cell"><span class="n">C${i + 1}</span><div class="bar"><i></i></div><span class="v num"></span><span class="d num"></span></div>`).join('');
  }
  const lo = Math.min(...s.cells), hi = Math.max(...s.cells), dmv = (hi - lo) * 1000;
  const marked = dmv > BAL_DONE_MV;   // 균형 상태에선 최고·최저 표시 안 함
  [...box.children].forEach((el, i) => {
    const v = s.cells[i], up = (v - lo) * 1000, bal = !!(s.bal && s.bal[i]);
    el.className = 'cell' + (bal ? ' bal' : marked && v === hi ? ' hi' : marked && v === lo ? ' lo' : '');
    el.querySelector('.bar i').style.width = `${clamp((v - V_LO) / (V_HI - V_LO), 0.02, 1) * 100}%`;
    el.querySelector('.v').textContent = `${v.toFixed(3)} V`;
    const d = el.querySelector('.d');
    d.textContent = `+${up.toFixed(0)} mV`;
    d.className = 'd num' + (up <= BAL_DONE_MV ? '' : up <= 50 ? ' warn' : ' bad');
  });
  $('delta').textContent = `차이 ${dmv.toFixed(0)} mV`;
  $('delta').className = 'pill num ' + (dmv <= BAL_DONE_MV ? 'ok' : dmv <= 50 ? 'warn' : 'bad');
  const balN = (s.bal || []).filter(Boolean).length;
  $('cellNote').textContent = balN ? `노란 막대 ${balN}개 셀을 밸런싱하고 있습니다.`
    : marked ? '보라색이 가장 높은 셀, 하늘색이 가장 낮은 셀입니다.' : '';
}

/* ---------- 지금 상태 ---------- */
const RING_C = 2 * Math.PI * 44;
$('ringFg').style.strokeDasharray = RING_C;
function renderHero(s) {
  const running = s.state === 'RUN';
  const pc = s.state === 'DONE' ? 1 : running ? s.progress : null;
  $('chip').textContent = running ? `실행 중 · ${ko('mode', s.mode)}` : ko('state', s.state) || s.state;
  $('chip').className = 'chip' + (running ? ' run' : '');
  $('heroTitle').textContent = running ? { STORAGE: '보관 방전 중', BALANCE: '밸런싱 중', CAPACITY: '용량 테스트 중' }[s.mode] || s.mode
    : { IDLE: '배터리를 연결하세요', DIAG: '진단하는 중', SELECT: '모드를 고르세요', DONE: '작업 완료', HOLD: '결과 표시 중', STOP: '정지됨' }[s.state] || s.state;
  let note;
  if (running) {
    note = s.mode === 'BALANCE' ? '전압이 높은 셀만 조금씩 방전합니다.'
      : `${s.mode === 'STORAGE' ? '목표' : '종료'} 셀당 ${f(s.targetV, 2)} V${s.limit ? ` · ${ko('limit', s.limit)}` : ''}`;
  } else {
    note = {
      IDLE: '연결하면 자동으로 진단합니다.', DIAG: '셀별 내부저항을 재고 있습니다.',
      SELECT: s.soh != null ? `건강도 ${s.soh}점. 아래에서 모드를 시작하세요.` : '아래에서 모드를 시작하세요.',
      DONE: '작업을 마쳤습니다.', HOLD: '다른 모드를 시작할 수 있습니다.',
      STOP: s.alarms.length ? `보호 동작: ${s.alarms.map(a => ko('alarm', a) || a).join(', ')}` : '수동으로 정지했습니다.',
    }[s.state] || '';
  }
  $('heroNote').textContent = note;
  $('ringFg').style.strokeDashoffset = RING_C * (1 - (pc || 0));
  $('pct').innerHTML = pc == null ? '-' : `${Math.round(pc * 100)}<small>%</small>`;
  const left = running && pc != null ? eta(pc, s.elapsed) : null;
  $('eta').textContent = left != null ? `${Math.ceil(left / 60)}분 남음` : running ? '계산 중' : '';
  $('mP').textContent = f(s.packV * s.current, 1);
  $('mI').textContent = f(s.current, 2);
  $('mV').textContent = f(s.packV, 2);
  $('mVlab').textContent = s.cellCount ? `팩 전압 · ${s.cellCount}S` : '팩 전압';
}

function renderSide(s) {
  $('soh').innerHTML = s.soh == null ? '-' : `${s.soh}<small>/ 100점</small>`;
  $('sohBar').style.width = `${s.soh ?? 0}%`;
  $('sohBar').style.background = s.soh == null ? '' : s.soh >= 80 ? 'var(--accent)' : s.soh >= 50 ? 'var(--warn)' : 'var(--bad)';
  $('irRange').textContent = s.ir ? `${Math.min(...s.ir).toFixed(1)}~${Math.max(...s.ir).toFixed(1)} mΩ` : '-';
  $('cap').textContent = s.capMeasuredAh == null ? '측정 전' : `${Math.round(s.capMeasuredAh * 1000)} mAh`;
  $('tSink').innerHTML = `${f(s.tempSink, 1)}<small>°C</small>`;
  $('tBar').style.width = `${clamp((s.tempSink - 20) / 75, 0, 1) * 100}%`;   // 20~95 °C
  $('tBar').style.background = s.tempSink >= 95 ? 'var(--bad)' : s.tempSink >= 80 ? 'var(--warn)' : 'var(--accent)';
  $('fan').textContent = s.fanRpm ? `${s.fanRpm} RPM` : '정지';
  $('duty').textContent = `${f(s.duty * 100, 1)} %`;
}

/* ---------- 시작 ---------- */
const modeInputs = () => [...document.querySelectorAll('input[name=mode]')];
const curMode = () => modeInputs().find(r => r.checked).value;
function syncStart() {
  const s = last, mode = curMode();
  $('modeDesc').textContent = MODE_DESC[mode];
  $('tgtBox').hidden = mode !== 'STORAGE';
  const can = online() && s && STARTABLE.includes(s.state);
  // 실행·진단 중에는 시작 칸을 숨긴다 (개요 탭일 때만)
  $('startCard').hidden = curTab() !== 'home' || !can;
  let why = '';
  if (can && mode !== 'DIAG' && s.alarms.includes('HIGH_IR')) why = '내부저항이 높아 방전 모드는 시작할 수 없습니다. 진단만 할 수 있습니다.';
  $('go').disabled = !!why;
  $('why').textContent = why;
  $('kOk').disabled = !can;
}
function startCmd(mode) {
  const mah = Number($('capIn').value);
  if (!(mah >= 100 && mah <= 20000)) return log('배터리 용량은 100~20000 mAh로 입력하세요', true);
  send({ cmd: 'start', mode, targetV: Number(document.querySelector('input[name=tgt]:checked').value), capacityAh: mah / 1000 });
}

/* ---------- 전체 갱신 ---------- */
function render(s, redraw) {
  if (!redraw) {
    const first = !last;
    if ((last && s.t < last.t) || s.events.includes('START')) { clearCharts(); hist = []; }   // 새 작업 또는 장치 재시작
    if (first && s.selMode) { const r = $(`m${s.selMode}`); if (r) r.checked = true; }
    if (last && s.state !== last.state && !s.events.includes(s.state)) log(`${ko('state', s.state)} (${s.state})`);
    const prev = last ? last.alarms : [];
    s.alarms.filter(a => !prev.includes(a)).forEach(a => log(`경고: ${ko('alarm', a)}`, true));
    s.events.filter(e => KO.event[e]).forEach(e => log(`${ko('event', e)}${e === 'START' && s.mode ? ` · ${ko('mode', s.mode)}` : ''}`));
    if (s.elapsed != null) {   // 그래프는 실행 중인 작업만 그린다
      push(chartVI, s.elapsed / 60, [s.packV, s.current]);
      push(chartT, s.elapsed / 60, [s.tempSink]);
      $('emptyVI').hidden = $('emptyT').hidden = true;
    }
    last = s;
  }
  $('simTag').hidden = !s.sim;
  const home = curTab() === 'home';
  $('alarm').hidden = !home || !s.alarms.length;
  $('alarm').innerHTML = `<b>경고</b>${s.alarms.map(a => `<span>${ko('alarm', a) || a}</span>`).join('')}`;
  $('faultCard').hidden = curTab() !== 'device' || !s.sim;
  renderHero(s);
  renderCells(s);
  renderSide(s);
  drawOled(s);
  syncStart();
  if (redraw && curTab() === 'chart') { chartVI.update('none'); chartT.update('none'); }
}

/* ---------- 조작 ---------- */
$('stop').onclick = $('kStop').onclick = () => send({ cmd: 'stop' });
$('kNext').onclick = () => { oledView++; if (last) drawOled(last); };
$('kOk').onclick = () => { if (last) startCmd(last.selMode || curMode()); };   // 장비 OK 버튼처럼 고른 모드를 시작
$('keyTone').onchange = e => send({ cmd: 'set', key: 'buzzerKeyTone', value: e.target.checked });
document.querySelectorAll('[data-fault]').forEach(b => { b.onclick = () => send({ cmd: 'fault', name: b.dataset.fault }); });
document.querySelectorAll('input[name=mode]').forEach(r => { r.onchange = syncStart; });
$('startForm').onsubmit = e => { e.preventDefault(); startCmd(curMode()); };
try { const t = localStorage.getItem('tab'); if (t && tabs.some(b => b.dataset.tab === t)) showTab(t); } catch (e) { /* 저장소가 막혀도 동작 */ }
syncStart();
connect();
</script>
</body>
